<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Project SEKAI — 星乃一歌</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Orbitron:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      overflow: hidden;
      background: #1a1020;
      font-family: "Noto Sans SC", sans-serif;
      color: #fff;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .stage {
      position: relative;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
    }
    .art {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 62% 12%;
    }
    .veil {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(18, 8, 28, 0.28) 0%, transparent 18%, transparent 52%, rgba(16, 6, 24, 0.55) 100%),
        radial-gradient(ellipse at 70% 18%, rgba(255, 190, 220, 0.16), transparent 42%);
      pointer-events: none;
    }
    .spark {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(1.5px 1.5px at 14% 16%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 82% 12%, #fff8, transparent),
        radial-gradient(2px 2px at 88% 70%, #ffe6ff, transparent),
        radial-gradient(1px 1px at 22% 78%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 48% 36%, #e8f7ff, transparent);
      animation: twinkle 4.8s ease-in-out infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.85; }
    }
    .top-left {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      left: 12px;
      right: 56px;
      font-size: 9px;
      letter-spacing: 0.02em;
      color: rgba(255, 255, 255, 0.7);
      text-shadow: 0 1px 6px rgba(0,0,0,.6);
      font-family: ui-monospace, Menlo, monospace;
      word-break: break-all;
    }
    .menu {
      position: absolute;
      top: max(10px, env(safe-area-inset-top));
      right: 12px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.88);
      background: rgba(255,255,255,0.12);
      color: #fff;
      font-size: 16px;
      display: grid;
      place-items: center;
      backdrop-filter: blur(10px);
    }
    .brands {
      position: absolute;
      top: calc(max(10px, env(safe-area-inset-top)) + 40px);
      right: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: flex-end;
    }
    .pill {
      height: 20px;
      padding: 0 7px;
      border-radius: 4px;
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.28);
      font-size: 8px;
      letter-spacing: 0.08em;
      display: grid;
      place-items: center;
      backdrop-filter: blur(8px);
    }
    .center {
      position: absolute;
      left: 50%;
      bottom: max(18%, calc(env(safe-area-inset-bottom) + 118px));
      transform: translateX(-50%);
      text-align: center;
      width: min(92vw, 420px);
    }
    .series {
      font-size: 13px;
      letter-spacing: 0.22em;
      font-weight: 700;
      text-shadow: 0 2px 10px rgba(0,0,0,.5);
    }
    .logo {
      margin: 8px 0 6px;
      font-weight: 900;
      font-size: clamp(26px, 8.2vw, 40px);
      letter-spacing: 0.03em;
      line-height: 1.08;
      background: linear-gradient(180deg, #ffffff 18%, #d6f3ff 55%, #ffd6f0 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 4px 14px rgba(40, 20, 60, 0.5));
    }
    .sub {
      font-size: 12px;
      letter-spacing: 0.14em;
      text-shadow: 0 2px 8px rgba(0,0,0,.55);
    }
    .world {
      margin-top: 12px;
      font-family: Orbitron, sans-serif;
      font-weight: 700;
      font-size: clamp(18px, 6.6vw, 28px);
      letter-spacing: 0.14em;
      color: #eaf7ff;
      text-shadow: 0 0 18px rgba(120, 200, 255, 0.55), 0 3px 10px rgba(0,0,0,.45);
    }
    .tap {
      margin-top: 22px;
      font-size: 15px;
      letter-spacing: 0.34em;
      font-weight: 500;
      animation: pulse 1.8s ease-in-out infinite;
      text-shadow: 0 2px 10px rgba(0,0,0,.55);
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.32; }
      50% { opacity: 1; }
    }
    .bottom-left {
      position: absolute;
      left: 10px;
      bottom: max(8px, env(safe-area-inset-bottom));
      font-size: 8px;
      line-height: 1.4;
      color: rgba(255,255,255,0.7);
      text-shadow: 0 1px 4px rgba(0,0,0,.65);
      max-width: 48vw;
    }
    .bottom-right {
      position: absolute;
      right: 10px;
      bottom: max(8px, env(safe-area-inset-bottom));
      text-align: right;
      font-size: 8px;
      line-height: 1.4;
      color: rgba(255,255,255,0.76);
      text-shadow: 0 1px 4px rgba(0,0,0,.65);
      max-width: 46vw;
    }
  </style>
</head>
<body>
  <div class="stage">
    <img class="art" src="https://i.ibb.co/xSsXnQRd/ichika-tra-sharp.png" alt="星乃一歌" />
    <div class="veil"></div>
    <div class="spark"></div>
    <div class="top-left">73a13f0f-c586-44f7-9a46-b7a430850293</div>
    <div class="menu">≡</div>
    <div class="brands">
      <span class="pill">Diarkis</span>
      <span class="pill">Live2D</span>
      <span class="pill">CRIWARE</span>
    </div>
    <div class="center">
      <div class="series">Project SEKAI</div>
      <div class="logo">COLORFUL STAGE!</div>
      <div class="sub">feat. 初音ミク　·　星乃一歌</div>
      <div class="world">WORLD LINK</div>
      <div class="tap" id="tap">TAP TO START</div>
    </div>
    <div class="bottom-left">
      JASRAC許諾 第9023656028Y58103号<br />
      許諾番号：ID000005829
    </div>
    <div class="bottom-right">
      7.0.0.Luna<br />
      UserID: 12305718330118151
    </div>
  </div>
  <script>
    const tap = document.getElementById("tap");
    document.querySelector(".stage").addEventListener("click", () => {
      tap.textContent = "STARTING…";
      tap.style.animation = "none";
      tap.style.opacity = "1";
    });
  </script>
</body>
</html>
