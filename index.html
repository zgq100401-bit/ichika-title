<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Project SEKAI — 星乃一歌</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&family=Orbitron:wght@700&display=swap" rel="stylesheet"/>
<style>
:root{--t:max(10px,env(safe-area-inset-top));--b:max(10px,env(safe-area-inset-bottom))}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#140c16;color:#fff;font-family:"Noto Sans SC",sans-serif;user-select:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer}
.page{position:absolute;inset:0;width:100vw;height:100dvh;overflow:hidden;opacity:0;pointer-events:none;transition:.35s}
.page.on{opacity:1;pointer-events:auto}
.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:62% 12%}
.veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(16,8,24,.28),transparent 22%,rgba(12,6,20,.66));pointer-events:none}
.flash{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 40%,#fff,#ffe6f4 42%,#c9e8ff);opacity:0;pointer-events:none}
.flash.on{animation:flash 1s ease forwards}
@keyframes flash{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
.toast{position:fixed;left:50%;bottom:22%;transform:translateX(-50%);background:rgba(18,10,26,.82);border:1px solid rgba(255,255,255,.22);padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;z-index:60;transition:.22s}
.toast.show{opacity:1}
.center{position:absolute;left:50%;bottom:max(18%,calc(var(--b)+118px));transform:translateX(-50%);text-align:center;width:min(92vw,420px)}
.series{font-size:13px;letter-spacing:.22em;font-weight:700}
.logo{margin:8px 0;font-weight:900;font-size:clamp(26px,8vw,40px);background:linear-gradient(#fff,#d6f3ff,#ffd6f0);-webkit-background-clip:text;color:transparent}
.world{margin-top:12px;font-family:Orbitron,sans-serif;letter-spacing:.14em;color:#eaf7ff}
.tap{margin-top:22px;letter-spacing:.34em;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.32}50%{opacity:1}}
.hud{position:absolute;top:var(--t);left:10px;right:10px;display:flex;justify-content:space-between}
.chip{background:rgba(20,10,28,.5);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(12px);border-radius:16px;padding:8px 11px}
.chip b{display:block}
.home-copy{position:absolute;left:16px;right:16px;bottom:calc(var(--b)+108px)}
.home-copy h2{font-size:28px}
.dock{position:absolute;left:8px;right:8px;bottom:var(--b);display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.dock button,.bar button,.ghost,.primary,.hit{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.14);border-radius:14px;padding:11px 4px;backdrop-filter:blur(12px)}
.primary{background:linear-gradient(#ff9ec4,#d46a9a);border-color:#ffd0e4;font-weight:700}
.panel{position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,10,28,.72),rgba(18,10,28,.92));backdrop-filter:blur(16px);padding:calc(var(--t)+8px) 14px calc(var(--b)+12px);overflow:auto}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.list{display:flex;flex-direction:column;gap:8px}
.row,.card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{display:flex;gap:10px;margin:8px 0 14px}
.stat .chip{flex:1;text-align:center}
.lane{width:min(92vw,420px);height:220px;position:relative;border-bottom:2px solid #fff8;margin:0 auto 18px;overflow:hidden}
.hitline{position:absolute;left:0;right:0;bottom:18px;height:4px;background:#fff}
.note{position:absolute;left:50%;width:54px;height:18px;margin-left:-27px;border-radius:9px;background:linear-gradient(90deg,#9ad7ff,#ff9ec8)}
.judge{height:28px;font-size:22px;font-weight:900;text-align:center}
.hit{width:min(92vw,420px);height:64px;display:block;margin:0 auto;font-size:18px;letter-spacing:.28em}
.fine{position:absolute;bottom:var(--b);font-size:8px;opacity:.75}
.fine.l{left:10px}.fine.r{right:10px;text-align:right}
.menu-btn{position:absolute;top:var(--t);right:12px;width:34px;height:34px;border-radius:50%;border:1.5px solid #fff;background:rgba(255,255,255,.12)}
</style>
</head>
<body>
<div class="page on" id="title">
<img class="art" src="https://i.ibb.co/xSsXnQRd/ichika-tra-sharp.png" alt="星乃一歌"/>
<div class="veil"></div>
<button class="menu-btn" id="titleMenu" type="button">≡</button>
<div class="center">
<div class="series">Project SEKAI</div>
<div class="logo">COLORFUL STAGE!</div>
<div> feat. 初音ミク · 星乃一歌</div>
<div class="world">WORLD LINK</div>
<div class="tap" id="tap">TAP TO START</div>
</div>
<div class="fine l">粉丝自制展示站，与官方无关</div>
<div class="fine r">本地存档已启用</div>
</div>
<div class="page" id="home">
<img class="art" src="https://i.ibb.co/xSsXnQRd/ichika-tra-sharp.png" alt=""/>
<div class="veil"></div>
<div class="hud">
<div class="chip"><b id="playerName">ICHIKA</b><span id="playerMeta">Leo/need</span></div>
<div class="chip" style="text-align:right"><span id="crystals">水晶 1600</span><br><small id="coins">虚拟币 250000</small></div>
</div>
<div class="home-copy"><h2>星乃一歌</h2><p id="welcome">欢迎回来。</p></div>
<div class="dock">
<button data-go="live">LIVE</button>
<button data-go="chars">角色</button>
<button data-go="cards">卡片</button>
<button data-go="shop">商店</button>
<button data-go="title">标题</button>
</div>
</div>
<div class="page" id="live"><div class="panel"><div class="bar"><h3>LIVE</h3><button data-go="home">返回</button></div><div class="stat"><div class="chip">体力 <b id="energy">5 / 5</b></div><div class="chip">最高分 <b id="bestScore">0</b></div></div><div class="list" id="songs"></div></div></div>
<div class="page" id="livePlay"><div class="panel"><div class="bar"><h3 id="playTitle">LIVE</h3><button id="giveUp">放弃</button></div><div class="judge" id="judge">READY</div><div class="lane"><div class="hitline"></div><div class="note" id="note"></div></div><button class="hit" id="hit" type="button">TAP</button><p id="playStat" style="text-align:center;margin-top:10px">连击 0</p></div></div>
<div class="page" id="result"><div class="panel"><div class="bar"><h3>结算</h3><button data-go="live">曲目</button></div><div class="card" style="text-align:center"><div>RANK</div><div id="rankMark" style="font-size:64px;font-weight:900">S</div><div id="resultScore">0</div><p id="resultDetail"></p></div><button class="primary" data-go="home" style="width:100%;margin-top:14px">回主页</button></div></div>
<div class="page" id="chars"><div class="panel"><div class="bar"><h3>角色</h3><button data-go="home">返回</button></div><div class="list" id="charList"></div></div></div>
<div class="page" id="cards"><div class="panel"><div class="bar"><h3>卡片</h3><button data-go="home">返回</button></div><button class="primary" id="gacha" style="width:100%;margin-bottom:12px">招募一次 · 300 水晶</button><div class="grid" id="cardGrid"></div></div></div>
<div class="page" id="shop"><div class="panel"><div class="bar"><h3>商店</h3><button data-go="home">返回</button></div><div class="list"><div class="row"><div><b>体力 +1</b><small>50 币</small></div><button data-buy="energy">购买</button></div><div class="row"><div><b>体力回满</b><small>200 币</small></div><button data-buy="full">购买</button></div><div class="row"><div><b>水晶 +300</b><small>12000 币</small></div><button data-buy="crystal">购买</button></div><div class="row"><div><b>重置存档</b></div><button id="resetSave">重置</button></div></div></div></div>
<div class="flash" id="flash"></div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body></html>
